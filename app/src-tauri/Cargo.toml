[package]
name = "pointr"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "pointr_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"

# Win32 / WinRT interop
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Win32_System_WinRT",
    "Media_SpeechSynthesis",
    "Media_Playback",
    "Media_Core",
    "Storage_Streams",
    "Foundation_Collections",
] }
windows-capture = "1"

# Image processing
image = { version = "0.25", default-features = false, features = ["png"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async
tokio = { version = "1", features = ["full"] }

# Error handling
anyhow = "1"
thiserror = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Utils
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
reqwest = { version = "0.13.4", features = ["json", "stream"] }
chrono = "0.4.45"
futures-util = "0.3"
arboard = "3"
enigo = "0.2"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# `image`/`png`/`miniz_oxide` are drastically slower unoptimized — PNG
# encode/decode of a full monitor screenshot went from ~9.5s combined down to
# a fraction of that once these compiled optimized, even in an otherwise
# unoptimized `tauri dev` build. Only affects dependency code, not this
# crate's own — the edit/compile/run loop for pointr's own source is
# unaffected, this just makes the one hot path fast too.
[profile.dev.package."*"]
opt-level = 2
