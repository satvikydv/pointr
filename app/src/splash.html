<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pointr</title>
    <style>
      @keyframes orbBloomBreathe {
        0%, 100% { transform: scale(0.85); opacity: 0.55; }
        50% { transform: scale(1.35); opacity: 0.9; }
      }
      @keyframes orbSwirl1 {
        to { transform: rotate(360deg); }
      }
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: transparent;
        font-family: 'Segoe UI Variable', 'Segoe UI', system-ui, sans-serif;
        user-select: none;
        overflow: hidden;
      }
      #panel {
        width: 300px;
        height: 180px;
        box-sizing: border-box;
        background: rgba(22, 24, 29, 0.86);
        backdrop-filter: blur(30px) saturate(160%);
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 16px;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55), 0 1px 0 rgba(255, 255, 255, 0.07) inset;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        opacity: 0;
        transform: scale(0.94);
        transition: opacity 0.5s ease, transform 0.5s ease;
      }
      #panel.visible {
        opacity: 1;
        transform: scale(1);
      }
      #panel.leaving {
        opacity: 0;
        transform: scale(0.97);
      }
      #orb {
        position: relative;
        width: 64px;
        height: 64px;
        flex-shrink: 0;
      }
      #orb-bloom {
        position: absolute;
        width: 102px;
        height: 102px;
        left: -19px;
        top: -19px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(140, 180, 255, 0.5), rgba(91, 140, 255, 0.16) 45%, rgba(91, 140, 255, 0) 70%);
        filter: blur(8px);
        animation: orbBloomBreathe 3.4s ease-in-out infinite;
      }
      #orb-body {
        position: absolute;
        width: 64px;
        height: 64px;
        border-radius: 50%;
        overflow: hidden;
        isolation: isolate;
        box-shadow: 0 0 20px rgba(91, 140, 255, 0.5), inset 0 -8px 12px rgba(0, 0, 0, 0.35), inset 0 3px 6px rgba(255, 255, 255, 0.25);
        background: radial-gradient(circle at 32% 28%, rgba(210, 225, 255, 0.9), rgba(91, 140, 255, 0.5) 40%, rgba(30, 45, 90, 0.85) 78%, rgba(10, 14, 26, 0.95) 100%);
      }
      #orb-swirl {
        position: absolute;
        width: 85px;
        height: 85px;
        left: -11px;
        top: -11px;
        border-radius: 50%;
        background: conic-gradient(from 0deg, rgba(143, 180, 255, 0) 0%, rgba(143, 180, 255, 0.9) 15%, rgba(58, 99, 204, 0) 35%, rgba(185, 143, 255, 0.6) 55%, rgba(58, 99, 204, 0) 75%, rgba(143, 180, 255, 0.7) 95%);
        mix-blend-mode: screen;
        animation: orbSwirl1 4.2s linear infinite;
      }
      #orb-highlight {
        position: absolute;
        width: 24px;
        height: 15px;
        left: 10px;
        top: 8px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(255, 255, 255, 0.85), rgba(255, 255, 255, 0) 75%);
      }
      #wordmark {
        font-size: 22px;
        font-weight: 600;
        color: rgba(255, 255, 255, 0.94);
        letter-spacing: 0.01em;
      }
      #status {
        font-size: 13px;
        color: rgba(255, 255, 255, 0.55);
        opacity: 1;
        transition: opacity 0.18s ease;
        min-height: 16px;
      }
    </style>
  </head>
  <body>
    <div id="panel">
      <div id="orb">
        <div id="orb-bloom"></div>
        <div id="orb-body">
          <div id="orb-swirl"></div>
          <div id="orb-highlight"></div>
        </div>
      </div>
      <div id="wordmark">Pointr</div>
      <div id="status">Starting…</div>
    </div>

    <script type="module" src="/splash.js"></script>
  </body>
</html>
