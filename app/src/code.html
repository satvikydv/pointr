<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pointr Code</title>
    <link rel="stylesheet" href="vendor/highlight/github-dark.min.css" />
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
        font-family: 'Segoe UI Variable', 'Segoe UI', system-ui, sans-serif;
        user-select: none;
      }
      #card {
        box-sizing: border-box;
        height: 100%;
        display: flex;
        flex-direction: column;
        background: rgba(13, 15, 19, 0.95);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 14px;
        color: rgba(255, 255, 255, 0.92);
        overflow: hidden;
      }
      #bar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 9px 14px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.07);
        font-size: 12px;
        color: rgba(255, 255, 255, 0.55);
        flex-shrink: 0;
      }
      #dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #6b7280;
        flex-shrink: 0;
      }
      #dot.working { background: #60a5fa; animation: pulse 1s ease-in-out infinite; }
      #dot.done { background: #34d399; }
      #dot.error { background: #f87171; }
      @keyframes pulse { 50% { opacity: 0.35; } }
      #title { color: rgba(255, 255, 255, 0.85); font-weight: 600; }
      #lang {
        flex: 1;
        min-width: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #timing { flex-shrink: 0; }
      #body {
        flex: 1;
        overflow-y: auto;
        padding: 10px 16px 16px;
        font-size: 14px;
        line-height: 1.5;
        scroll-behavior: smooth;
      }
      #body::-webkit-scrollbar { width: 0; }
      h3 {
        margin: 14px 0 6px;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: rgba(147, 180, 255, 0.85);
      }
      h3:first-child { margin-top: 4px; }
      .p { margin: 0 0 6px; }
      ul { margin: 2px 0 0; padding-left: 18px; }
      li { margin: 2px 0; color: rgba(255, 255, 255, 0.85); }
      code {
        font-family: 'Cascadia Code', Consolas, monospace;
        font-size: 12.5px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 4px;
        padding: 0 4px;
      }
      b { color: #fff; font-weight: 600; }
      .code {
        display: flex;
        margin: 4px 0 6px;
        background: #0d1117;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 8px;
        overflow-x: auto;
        font-family: 'Cascadia Code', Consolas, monospace;
        font-size: 13px;
        line-height: 1.5;
      }
      .code .gutter {
        padding: 10px 8px 10px 10px;
        text-align: right;
        color: rgba(255, 255, 255, 0.25);
        white-space: pre;
        flex-shrink: 0;
        border-right: 1px solid rgba(255, 255, 255, 0.06);
      }
      .code pre { margin: 0; padding: 10px 12px; white-space: pre; }
      .code pre code { background: none; padding: 0; font-size: inherit; }
      .hljs { background: transparent; }
      .muted { color: rgba(255, 255, 255, 0.45); font-size: 13px; }
      .error { color: #fca5a5; font-size: 13.5px; }
      #foot {
        padding: 6px 14px 8px;
        font-size: 10.5px;
        color: rgba(255, 255, 255, 0.32);
        border-top: 1px solid rgba(255, 255, 255, 0.05);
        flex-shrink: 0;
      }
    </style>
  </head>
  <body>
    <div id="card">
      <div id="bar">
        <div id="dot"></div>
        <div id="title">Coding</div>
        <div id="lang"></div>
        <div id="timing"></div>
      </div>
      <div id="body">
        <div class="muted">Press the solve key when a coding problem is on screen.</div>
      </div>
      <div id="foot"><span id="solve-key">Ctrl+Alt+K</span> again: revise · Ctrl+Alt+PgUp/PgDn scroll · Ctrl+Alt+←/→ move · Ctrl+Alt+X hide</div>
    </div>
    <script src="vendor/highlight/highlight.min.js"></script>
    <script src="code.js"></script>
  </body>
</html>
