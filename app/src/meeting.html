<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pointr Meeting</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
        font-family: 'Segoe UI Variable', 'Segoe UI', system-ui, sans-serif;
        user-select: none;
      }
      #card {
        box-sizing: border-box;
        height: 100%;
        display: flex;
        flex-direction: column;
        background: rgba(18, 20, 25, 0.88);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 14px;
        color: rgba(255, 255, 255, 0.92);
        overflow: hidden;
      }
      #bar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        font-size: 11.5px;
        color: rgba(255, 255, 255, 0.55);
        flex-shrink: 0;
      }
      #dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #6b7280;
        flex-shrink: 0;
        transition: transform 0.08s linear, background 0.2s ease;
      }
      #dot.listening { background: #34d399; }
      #dot.warn { background: #fbbf24; }
      #dot.error { background: #f87171; }
      #state { color: rgba(255, 255, 255, 0.8); font-weight: 600; flex-shrink: 0; }
      #heard {
        flex: 1;
        min-width: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        font-style: italic;
      }
      #shield {
        display: none;
        padding: 6px 12px;
        font-size: 11.5px;
        background: rgba(248, 113, 113, 0.16);
        color: #fecaca;
        flex-shrink: 0;
      }
      #body {
        flex: 1;
        overflow-y: auto;
        padding: 10px 14px 12px;
        font-size: 14px;
        line-height: 1.5;
        scroll-behavior: smooth;
      }
      #body::-webkit-scrollbar { width: 0; }
      .q {
        font-size: 12px;
        color: #93b4ff;
        margin-bottom: 6px;
      }
      .p { margin: 0 0 6px; }
      ul { margin: 2px 0 0; padding-left: 18px; }
      li { margin: 2px 0; color: rgba(255, 255, 255, 0.82); }
      .ph { color: #fbbf24; }
      .muted { color: rgba(255, 255, 255, 0.45); font-size: 12.5px; }
      .error { color: #fca5a5; font-size: 13px; }
      #foot {
        padding: 5px 12px 7px;
        font-size: 10.5px;
        color: rgba(255, 255, 255, 0.32);
        display: flex;
        justify-content: space-between;
        flex-shrink: 0;
      }
    </style>
  </head>
  <body>
    <div id="card">
      <div id="bar">
        <div id="dot"></div>
        <div id="state">Meeting mode</div>
        <div id="heard"></div>
      </div>
      <div id="shield"></div>
      <div id="body">
        <div class="muted">Listening to the meeting audio. Press Ctrl+Alt+Enter when you want an answer to what was just asked.</div>
      </div>
      <div id="foot">
        <span>Ctrl+Alt+Enter answer · ↑/↓ scroll · H hide · <span id="end-key">Ctrl+Alt+M</span> end</span>
        <span id="latency"></span>
      </div>
    </div>
    <script src="meeting.js"></script>
  </body>
</html>
