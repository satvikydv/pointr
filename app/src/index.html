<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pointr Overlay</title>
  </head>
  <body>
    <div id="overlay-container">
      <img id="screenshot-img" src="" alt="Screenshot" />
      <div id="selection-box" style="display: none;"></div>
      <div id="loading-indicator" class="loading-indicator hidden">Thinking&hellip;</div>
      <div id="direct-query-box" class="direct-query-box hidden">
        <input id="direct-query-input" class="query-input direct-query-input" type="text" placeholder="What do you want to know? (Enter to send, Esc to cancel)" autocomplete="off" />
      </div>

      <div id="toolbar" class="toolbar hidden">
        <button id="btn-cancel" class="btn">Cancel (Esc)</button>
        <input id="query-input" class="query-input" type="text" placeholder="What is this? (or &quot;agent: &lt;task&gt;&quot;)" autocomplete="off" />
        <button id="btn-submit" class="btn btn-primary">Process</button>
      </div>
    </div>
    
    <script type="module" src="/main.js"></script>
  </body>
</html>
