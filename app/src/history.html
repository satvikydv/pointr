<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pointr Agent History</title>
    <style>
      @keyframes pointrFadeIn {
        from { opacity: 0; transform: translateY(6px); }
        to { opacity: 1; transform: translateY(0); }
      }
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: transparent;
        font-family: 'Segoe UI Variable', 'Segoe UI', system-ui, sans-serif;
        user-select: none;
        overflow: hidden;
      }
      #panel {
        width: 460px;
        height: 100vh;
        box-sizing: border-box;
        background: rgba(22, 24, 29, 0.86);
        backdrop-filter: blur(30px) saturate(160%);
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 14px;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55), 0 1px 0 rgba(255, 255, 255, 0.07) inset;
        display: flex;
        flex-direction: column;
        animation: pointrFadeIn 0.16s ease;
        color: rgba(255, 255, 255, 0.92);
      }
      #titlebar {
        height: 40px;
        min-height: 40px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 12px 0 16px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      }
      #titlebar .brand {
        display: flex;
        align-items: center;
        gap: 7px;
      }
      #titlebar .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #5b8cff;
      }
      #titlebar .label {
        font-size: 11px;
        letter-spacing: 0.04em;
        color: rgba(255, 255, 255, 0.5);
        text-transform: uppercase;
      }
      #btn-close {
        width: 22px;
        height: 22px;
        border-radius: 5px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: rgba(255, 255, 255, 0.45);
        cursor: pointer;
        font-size: 14px;
        background: transparent;
        border: none;
      }
      #btn-close:hover {
        background: rgba(255, 255, 255, 0.08);
        color: rgba(255, 255, 255, 0.85);
      }
      #body {
        flex: 1;
        min-height: 0;
        position: relative;
        display: flex;
        flex-direction: column;
      }
      #content {
        flex: 1;
        min-height: 0;
        padding: 14px 16px;
        display: flex;
        flex-direction: column;
        position: relative;
        overflow-y: auto;
        scrollbar-width: thin;
        scrollbar-color: rgba(255, 255, 255, 0.16) transparent;
      }
      #content::-webkit-scrollbar { width: 6px; }
      #content::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.16); border-radius: 3px; }
      #content::-webkit-scrollbar-track { background: transparent; }
      #scroll-fade {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 22px;
        background: linear-gradient(to bottom, rgba(22, 24, 29, 0), rgba(22, 24, 29, 0.95));
        pointer-events: none;
      }

      .run-row {
        border-radius: 10px;
        padding: 12px;
        margin-bottom: 8px;
        cursor: pointer;
        transition: background 0.12s ease;
        border: 1px solid transparent;
      }
      .run-row.expanded {
        background: rgba(255, 255, 255, 0.045);
        border-color: rgba(255, 255, 255, 0.09);
      }
      .run-head {
        display: flex;
        align-items: flex-start;
        gap: 10px;
      }
      .run-task {
        font-size: 13.5px;
        font-weight: 600;
        color: rgba(255, 255, 255, 0.92);
        line-height: 1.35;
      }
      .run-meta {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-top: 5px;
        min-width: 0;
      }
      .run-time {
        font-size: 11.5px;
        color: rgba(255, 255, 255, 0.4);
        flex-shrink: 0;
        white-space: nowrap;
      }
      .run-sep {
        font-size: 11.5px;
        color: rgba(255, 255, 255, 0.3);
        flex-shrink: 0;
      }
      .run-preview {
        font-size: 11.5px;
        color: rgba(255, 255, 255, 0.5);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        min-width: 0;
      }
      .run-side {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-shrink: 0;
      }
      .run-badge {
        display: flex;
        align-items: center;
        gap: 5px;
        border-radius: 11px;
        padding: 4px 9px;
      }
      .run-badge-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        flex-shrink: 0;
      }
      .run-badge-text {
        font-size: 11px;
        font-weight: 600;
        white-space: nowrap;
      }
      .run-chevron {
        width: 7px;
        height: 7px;
        border-right: 1.4px solid rgba(255, 255, 255, 0.4);
        border-bottom: 1.4px solid rgba(255, 255, 255, 0.4);
        transform: rotate(45deg);
        transition: transform 0.12s ease;
        flex-shrink: 0;
      }
      .run-row.expanded .run-chevron {
        transform: rotate(225deg) translate(-1px, -1px);
      }
      .run-detail {
        margin-top: 14px;
        padding-top: 14px;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
      }
      .detail-label {
        font-size: 10.5px;
        letter-spacing: 0.06em;
        color: rgba(255, 255, 255, 0.4);
        text-transform: uppercase;
        margin-bottom: 7px;
      }
      .plan-box {
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 8px;
        padding: 10px 12px;
        margin-bottom: 16px;
      }
      .plan-item {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        margin-bottom: 6px;
      }
      .plan-item:last-child { margin-bottom: 0; }
      .plan-num {
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.08);
        color: rgba(255, 255, 255, 0.55);
        font-size: 10px;
        font-weight: 600;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        margin-top: 0.5px;
      }
      .plan-text {
        font-size: 12.5px;
        line-height: 1.5;
        color: rgba(255, 255, 255, 0.7);
      }
      .step-row {
        display: flex;
        gap: 10px;
      }
      .step-icon-col {
        display: flex;
        flex-direction: column;
        align-items: center;
        flex-shrink: 0;
      }
      .step-icon {
        width: 24px;
        height: 24px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.1);
        display: flex;
        align-items: center;
        justify-content: center;
        color: rgba(255, 255, 255, 0.65);
        flex-shrink: 0;
      }
      .step-line {
        width: 1px;
        flex: 1;
        min-height: 12px;
        background: rgba(255, 255, 255, 0.1);
      }
      .step-body {
        flex: 1;
        min-width: 0;
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 8px;
      }
      .step-desc {
        font-size: 12.5px;
        line-height: 1.5;
        color: rgba(255, 255, 255, 0.8);
        padding-top: 4px;
      }
      .step-status { flex-shrink: 0; margin-top: 5px; }
      .run-note {
        margin-top: 12px;
        padding: 10px 12px;
        border-radius: 8px;
        font-size: 12.5px;
        line-height: 1.5;
      }

      #empty-state {
        flex: 1;
        min-height: 380px;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        text-align: center;
        padding: 0 30px;
      }
      #empty-state .ring {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        border: 1.5px solid rgba(255, 255, 255, 0.15);
        display: flex;
        align-items: center;
        justify-content: center;
        color: rgba(255, 255, 255, 0.3);
      }
      #empty-state .msg {
        font-size: 13.5px;
        color: rgba(255, 255, 255, 0.55);
        line-height: 1.5;
      }
      #empty-state .msg code {
        color: rgba(255, 255, 255, 0.75);
        font-family: Consolas, monospace;
        font-style: normal;
      }

      #footer {
        flex-shrink: 0;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
        padding: 14px 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 16px;
      }
      #footer-count {
        font-size: 12px;
        color: rgba(255, 255, 255, 0.4);
      }
      #btn-clear-history {
        font-size: 12.5px;
        font-weight: 600;
        color: #ef5b5b;
        cursor: pointer;
        background: none;
        border: none;
        padding: 0;
      }
      #footer-confirm {
        display: none;
        align-items: center;
        justify-content: space-between;
        width: 100%;
        gap: 10px;
      }
      #footer-confirm.visible { display: flex; }
      #footer-default.hidden { display: none; }
      #footer-confirm-text {
        font-size: 12px;
        color: rgba(255, 255, 255, 0.7);
      }
      #footer-confirm-actions {
        display: flex;
        gap: 8px;
        flex-shrink: 0;
      }
      #btn-cancel-clear, #btn-confirm-clear {
        font-size: 12.5px;
        font-weight: 600;
        padding: 7px 13px;
        border-radius: 7px;
        cursor: pointer;
        border: none;
      }
      #btn-cancel-clear {
        color: rgba(255, 255, 255, 0.85);
        background: rgba(255, 255, 255, 0.07);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
      #btn-confirm-clear {
        color: #fff;
        background: #ef5b5b;
      }
    </style>
  </head>
  <body>
    <div id="panel">
      <div id="titlebar" data-tauri-drag-region>
        <div class="brand" data-tauri-drag-region>
          <div class="dot"></div>
          <div class="label">Pointr Agent History</div>
        </div>
        <button id="btn-close">&times;</button>
      </div>

      <div id="body">
        <div id="content">
          <div id="runs-list"></div>
          <div id="empty-state">
            <div class="ring">
              <svg width="18" height="18" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="6.2" stroke="currentColor" stroke-width="1.2"></circle><path d="M8 4.6V8L10.2 9.6" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"></path></svg>
            </div>
            <div class="msg">No agent runs yet &mdash; try <code>agent: ...</code> from the overlay</div>
          </div>
        </div>
        <div id="scroll-fade"></div>
      </div>

      <div id="footer">
        <div id="footer-default">
          <span id="footer-count"></span>
        </div>
        <button id="btn-clear-history">Clear history</button>
        <div id="footer-confirm">
          <div id="footer-confirm-text">Delete all agent history? This can't be undone.</div>
          <div id="footer-confirm-actions">
            <button id="btn-cancel-clear">Cancel</button>
            <button id="btn-confirm-clear">Clear all</button>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="/history.js"></script>
  </body>
</html>
