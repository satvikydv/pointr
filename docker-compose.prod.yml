services:
  api:
    build: ./backend
    expose:
      - "8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.1-flash-lite}
      - REDIS_URL=redis://redis:6379/0
      - MARKER_MODE=${MARKER_MODE:-burned_in}
      - POINTR_CLIENT_KEY=${POINTR_CLIENT_KEY:-}
    depends_on: [redis]
    restart: unless-stopped

  worker:
    build: ./backend
    command: celery -A app.worker.celery_app worker --loglevel=info
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.1-flash-lite}
      - REDIS_URL=redis://redis:6379/0
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      # Filesystem MCP deliberately left unconfigured (no POINTR_FS_ROOT)
      # here — a centralized backend has no network route to any user's
      # local filesystem, regardless of path. needs_filesystem answers with
      # a clear "not set up" message instead. See implementation-tracking.md.
    depends_on: [redis]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      - POINTR_API_DOMAIN=${POINTR_API_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api]
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
