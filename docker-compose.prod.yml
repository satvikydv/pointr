# Retention posture (backs the claims on landing/privacy.html — keep them in
# sync). Nothing user-derived is meant to outlive a request by long:
#   - worker runs at --loglevel=warning: Celery's INFO "task succeeded"
#     line prints the task's whole return value (answer + plan text), so
#     INFO would write user-derived text into the container logs.
#   - every service's json-file log is size-capped and rotated, so whatever
#     does get logged is bounded instead of growing forever.
#   - redis persists nothing to disk (no RDB snapshots, no AOF): task
#     results, rate-limit counters and the short conversation memory
#     (backend/app/services/session_memory.py, expires after 20 minutes idle)
#     are memory-only, and Celery expires results after 5 minutes
#     (backend/app/worker/celery_app.py).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  api:
    build: ./backend
    expose:
      - "8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.1-flash-lite}
      - REDIS_URL=redis://redis:6379/0
      - MARKER_MODE=${MARKER_MODE:-burned_in}
      - POINTR_CLIENT_KEY=${POINTR_CLIENT_KEY:-}
    depends_on: [redis]
    restart: unless-stopped
    logging: *default-logging

  worker:
    build: ./backend
    command: celery -A app.worker.celery_app worker --loglevel=warning
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.1-flash-lite}
      - REDIS_URL=redis://redis:6379/0
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      # Filesystem MCP deliberately left unconfigured (no POINTR_FS_ROOT)
      # here — a centralized backend has no network route to any user's
      # local filesystem, regardless of path. needs_filesystem answers with
      # a clear "not set up" message instead. See implementation-tracking.md.
    depends_on: [redis]
    restart: unless-stopped
    logging: *default-logging

  redis:
    image: redis:7-alpine
    command: redis-server --save "" --appendonly no
    restart: unless-stopped
    logging: *default-logging

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      - POINTR_API_DOMAIN=${POINTR_API_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api]
    restart: unless-stopped
    logging: *default-logging

volumes:
  caddy_data:
  caddy_config:
